<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Pembelajaran Pecahan & Kuis Interaktif</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e0e0e0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #3498db;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .slider-group label {
            font-weight: 600;
        }
        .slider-group input {
            flex: 1;
        }
        .visual-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0;
        }
        .fraction-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #2c3e50;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .fraction-display {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            color: #2980b9;
            margin: 10px 0;
        }
        .quiz-card {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
            margin-bottom: 15px;
        }
        .quiz-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
        }
        .quiz-option:hover {
            background: #edf2f7;
        }
        .feedback {
            font-weight: bold;
            margin-top: 10px;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #e74c3c; }
        .score-box {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Media Pembelajaran Pecahan</h1>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab(event, 'simulasi')">Simulasi Pecahan</button>
        <button class="tab-btn" onclick="switchTab(event, 'kuis')">Kuis Interaktif</button>
    </div>

    <!-- TAB SIMULASI -->
    <div id="simulasi" class="tab-content active">
        <div class="controls">
            <div class="slider-group">
                <label>Pembilang: <span id="numVal">1</span></label>
                <input type="range" id="numerator" min="1" max="8" value="1" oninput="updateFraction()">
            </div>
            <div class="slider-group">
                <label>Penyebut: <span id="denVal">4</span></label>
                <input type="range" id="denominator" min="1" max="8" value="4" oninput="updateFraction()">
            </div>
        </div>

        <div class="fraction-display" id="fracText">1 / 4</div>

        <div class="visual-box">
            <div class="fraction-circle" id="circleVisual"></div>
        </div>
    </div>

    <!-- TAB KUIS -->
    <div id="kuis" class="tab-content">
        <h2>Kuis Pecahan</h2>
        <div id="quizContainer">
            <div class="quiz-card">
                <p id="quizQuestion" style="font-size: 16px; font-weight: 600;">Pertanyaan Kuis...</p>
                <div id="quizOptions"></div>
                <div id="quizFeedback" class="feedback"></div>
            </div>
            <button id="nextBtn" class
